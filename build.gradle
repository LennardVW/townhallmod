plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = "townhall"
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "townhall-gametest"
		enableGameTests = true
		enableClientGameTests = false
		eula = true
	}
}

// Benchmark GameTest (PerfBench): only registered and run with ./gradlew runGameTest -Dtownhall.bench=true
def benchOn = providers.systemProperty("townhall.bench").map { it == "true" }.getOrElse(false)
processGametestResources {
	inputs.property "bench", benchOn
	filesMatching("fabric.mod.json") {
		filter { line -> benchOn && line.contains('"fabric-gametest"') ? line.replace('"]', '", "dev.townhall.test.PerfBench"]') : line }
	}
}
tasks.named("runGameTest") {
	if (benchOn) jvmArgs("-Dtownhall.bench=true")
}
